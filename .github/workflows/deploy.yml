name: Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Activate pnpm
        run: corepack prepare pnpm@latest --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Create Wrangler secrets file
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const required = ["PUBLISH_TOKEN", "UPDATE_TOKEN_SECRET"];
          for (const key of required) {
            if (!process.env[key]) {
              throw new Error(`${key} is required`);
            }
          }
          const lines = required.map((key) => `${key}=${JSON.stringify(process.env[key])}`);
          fs.writeFileSync(".wrangler.secrets", `${lines.join("\n")}\n`, { mode: 0o600 });
          NODE
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          UPDATE_TOKEN_SECRET: ${{ secrets.UPDATE_TOKEN_SECRET }}

      - name: Deploy
        run: pnpm exec wrangler deploy --secrets-file .wrangler.secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Cleanup Wrangler secrets file
        if: always()
        run: rm -f .wrangler.secrets
